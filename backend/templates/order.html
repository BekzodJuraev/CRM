<!DOCTYPE html>
<html lang="ru">
<head>

}

custom-dropdown {
  position: relative;

}

.selected {
  padding: 8px;
  border: 1px solid #ccc;
  background: white;
  border-radius: 5px;
  cursor: pointer;
}

.dropdown-options {
  display: none;
  list-style: none;

/* Submenu styles */

  display: none;
}

.submenu {
  display: none;
  position: absolute;
  left: 100%;
  top: 0;
  list-style: none;
  margin: 0;
  padding: 0;
  width: 150px;
  border: 1px solid #ccc;
  background: white;
}

.submenu li {
  padding: 8px;

}

<body>
    <div class="container">
        <h2 class="text-center">Добавить новый заказ</h2>
        <form action="" method="POST">
            {% csrf_token %}
            <label>Клиент:</label>
            <input type="text" class="form-control" placeholder="ООО 'Реклама Плюс'" name="client" required>
            
            <label>Адрес:</label>
            <input type="text" class="form-control" placeholder="Введите адрес" name="adress" required>

            <label>Сумма заказа:</label>
            <input type="number" class="form-control" placeholder="100" name="order_sum" id="order_sum" required>

            <label>Сумма предоплаты (80% от суммы заказа):</label>
            <input type="number" class="form-control" placeholder="80" readonly name="order_predoplata" id="order_predoplata" required>

            <label>Категория заказа и Расходники:</label>
            <div class="category-container" id="categories-container">
                <div class="category-group">
                    <label>Категория заказа:</label>
                    <select class="form-select">
            <option value="Наружная реклама и макеты">Наружная реклама и макеты</option>
            <option value="Типография">Типография</option>
            <option value="Полиграфия">Полиграфия</option>
        </select>
                    <label>Расходник:</label>
                   <div class="input-group">
                <div class="custom-dropdown">
            <div class="selected" onclick="toggleDropdown(this)">-- Выберите --</div>
            <ul class="dropdown-options" id="dropdown-list"></ul>
            <input type="hidden" name="add" value="selectedValue" id="selectedValue">
        </div>


  <input type="number" class="form-control" placeholder="Стоимость" name="price" required>
  <input type="number" class="form-control" placeholder="Количество" name="quantity" min="1" required>
  <button type="button" class="btn btn-remove" onclick="removeCategoryGroup(this)">-</button>
</div>

                </div>
            </div>




            <button type="button" class="btn-add" onclick="addCategoryGroup()" >+ Добавить категорию и расходник</button>

            <label>Описание / ТЗ:</label>
            <textarea class="form-control" rows="3" name="description" required></textarea>

            <label>Номер телефона заказчика:</label>
            <input type="tel" class="form-control" placeholder="+79997777777" name="phone"  required>

            <label>Выберите источник заказа:</label>
            <select class="form-select" name="social" required>
                <option value="social">Социальные сети</option>
                <option value="cold_calls">Холодные звонки</option>
                <option value="word_of_mouth">Сарафанное радио</option>
            </select>

            <label>Выбор этапа:</label>
            <select class="form-select" name="stage" required>
                <option value="accepted">Принят</option>
                <option value="design">Проектирование</option>
                <option value="technologist">Технолог</option>
                <option value="manufacturing">Производство</option>
                 <option value="assembly">Сборка</option>
                <option value="delivery">Доставка</option>
                <option value="order_ready">Заказ готов</option>
                <option value="finished">Завершено</option>

            </select>

            <label>Дата добавления заказа:</label>
            <input type="date" class="form-control" name="add_order" required>

            <label>Срок выполнения:</label>
            <input type="date" class="form-control" name="complete_order"  required>

            <button type="submit" class="btn btn-primary w-100 mt-3">Сохранить</button>
        </form>
    </div>

    <script>
     document.getElementById('order_sum').addEventListener('input', function () {
    const orderSum = parseFloat(this.value);
    const predoplataInput = document.getElementById('order_predoplata');

    if (!isNaN(orderSum)) {
      predoplataInput.value = (orderSum * 0.8).toFixed(2);
    } else {
      predoplataInput.value = '';
    }
  });
        function addCategoryGroup() {
    let container = document.getElementById("categories-container");
    let newGroup = document.createElement("div");
    newGroup.classList.add("category-group");

    // Create a unique ID for the new dropdown
    const uniqueId = "dropdown-list-" + Date.now();
    const uniqueValueId = "selectedValue-" + Date.now();

    newGroup.innerHTML = `
        <label>Категория заказа:</label>
        <select class="form-select" name="catigories">
            <option value="Наружная реклама и макеты">Наружная реклама и макеты</option>
            <option value="Типография">Типография</option>
            <option value="Полиграфия">Полиграфия</option>
        </select>
        <label>Расходник:</label>
        <div class="input-group">
            <div class="custom-dropdown">
                <div class="selected" onclick="toggleDropdown(this)">-- Выберите --</div>
                <ul class="dropdown-options" id="${uniqueId}"></ul>--
                <input type="hidden" name="add" value="" id="${uniqueValueId}">
            </div>
            <input type="number" class="form-control" placeholder="Стоимость" name="price" required>
            <input type="number" class="form-control" placeholder="Количество" name="quantity" min="1" required>
            <button type="button" class="btn btn-remove" onclick="removeCategoryGroup(this)">-</button>
        </div>
    `;

    container.appendChild(newGroup);

    // Initialize the dropdown for this newly added group
    const select = newGroup.querySelector('.form-select');
    const selectedCategory = select.value;
    const dropdownList = newGroup.querySelector('.dropdown-options');

    // Populate the dropdown with items from the selected category
    buildDropdown(categoriesMap[selectedCategory] || [], dropdownList);
}

        function removeCategoryGroup(button) {
            button.closest(".category-group").remove();
        }

</script>
<script>   const categoriesMap = {
            "Наружная реклама и макеты": [
                {
                    label: "Бумага",
                    subItems: [
                        {
                            label: "Большой",
                            subItems: [
                                {
                                    label: "Черный",
                                    subItems: [{ label: "Тонкий" }]
                                },
                                { label: "1" },
                                { label: "2" }
                            ]
                        },
                        {
                            label: "Маленький",
                            subItems: [{ label: "3" }, { label: "4" }]
                        }
                    ]
                },
                {
                    label: "Переплеты",
                    subItems: [
                        {
                            label: "Плоская",
                            subItems: [{ label: "Серая" }, { label: "Голубая" }]
                        },
                        {
                            label: "Глубокая",
                            subItems: [{ label: "Белая" }, { label: "Желтая" }]
                        }
                    ]
                }
            ],
            "Типография": [
                {
                    label: "Тарелка",
                    subItems: [
                        {
                            label: "Плоская",
                            subItems: [{ label: "Серая" }, { label: "Голубая" }]
                        },
                        {
                            label: "Глубокая",
                            subItems: [{ label: "Белая" }, { label: "Желтая" }]
                        }
                    ]
                }
            ],
            "Полиграфия": [
                {label: "Бумага"},
                {
                    label: "Переплеты",
                    subItems:[
                        {
                            label: "Железный пружина",
                            subItems:[
                                {
                                    label: "Черный",
                                    subItems:[
                                        {label:"Маленький"},
                                        {label:"Средний"},
                                        {label:"Большой"}
                                    ]
                                },
                                {
                                    label:"Белый",
                                    subItems:[
                                        {label:"Маленький"},
                                        {label:"Средний"},
                                        {label:"Большой"}
                                    ]
                                }
                            ]
                        },
                        {
                            label:"Переплет для рефератов",
                            subItems:[
                                {label:"-------"},
                                {
                                    label:"Синий",
                                    subItems:[{label:"Стандартный"}]
                                }
                            ]
                        }
                    ]
                },
                {label: "Бокалы"},
                {label: "Кепки"},
                {label: "Футболки"},
                {label: "Ручки"},
                {label: "Флешки"},
                {label: "Коврики"},
                {label: "Часы"},
                {label: "Термосы"},
                {label: "Пригласительные"},
                {label: "Подарочные наборы"},
                {label: "Бейджики"}
            ]
        };

        // Initialize when the DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Find all category selectors
            const selectors = document.querySelectorAll('.form-select');

            selectors.forEach(selector => {
                // Add change event listener
                selector.addEventListener('change', function() {
                    const selectedCategory = this.value;
                    const selectedData = categoriesMap[selectedCategory] || [];

                    // Find the associated dropdown list
                    const parentContainer = this.closest('.category-container');
                    const dropdownList = parentContainer.querySelector('.dropdown-options');

                    if (dropdownList) {
                        buildDropdown(selectedData, dropdownList);
                    }
                });

                // Initialize with default category if available
                const selectedCategory = selector.value;
                if (selectedCategory) {
                    const selectedData = categoriesMap[selectedCategory] || [];
                    const parentContainer = selector.closest('.category-container');
                    const dropdownList = parentContainer.querySelector('.dropdown-options');

                    if (dropdownList) {
                        buildDropdown(selectedData, dropdownList);
                    }
                }
            });
        });

        // Function to build menu hierarchy
        function buildMenu(items, container, path = []) {
            container.innerHTML = ""; // Clear existing items

            items.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item.label;

                const currentPath = [...path, item.label];

                // Check for subItems and add submenu
                if (item.subItems && item.subItems.length > 0) {
                    li.classList.add("has-submenu");
                    const subUl = document.createElement("ul");
                    subUl.className = "submenu";
                    buildMenu(item.subItems, subUl, currentPath);
                    li.appendChild(subUl);

                    // Hover functionality for submenu
                    li.addEventListener("mouseover", () => {
                        subUl.style.display = "block";
                    });
                    li.addEventListener("mouseleave", () => {
                        subUl.style.display = "none";
                    });
                }

                // Add click listener for all items
                li.addEventListener("click", function(e) {
                    e.stopPropagation();
                    if (!item.subItems || item.subItems.length === 0) {
                        // Find the closest custom-dropdown parent
                        const dropdownElement = this.closest('.custom-dropdown');
                        selectOption(currentPath, dropdownElement);
                    }
                });

                container.appendChild(li);
            });
        }

        // Function to select an option and update the display
        function selectOption(pathArray, dropdownElement) {
            const value = pathArray.join(", ");

            // Update the display and hidden input
            const selectedElement = dropdownElement.querySelector(".selected");
            const inputElement = dropdownElement.querySelector("input[type='hidden']");
            const dropdownList = dropdownElement.querySelector(".dropdown-options");

            if (selectedElement) selectedElement.textContent = value;
            if (inputElement) inputElement.value = value;
            if (dropdownList) dropdownList.style.display = "none";
        }

        // Function to build a dropdown
        function buildDropdown(data = [], dropdownList) {
            if (!dropdownList) return;
            buildMenu(data, dropdownList);
        }

        // Toggle dropdown visibility function
        function toggleDropdown(element) {
    // If element is null or undefined, return early
    if (!element) {
        console.error("toggleDropdown: Element is undefined");
        return;
    }

    const dropdownContainer = element.closest('.custom-dropdown');
    if (!dropdownContainer) {
        console.error("toggleDropdown: Could not find parent .custom-dropdown");
        return;
    }

    const dropdownList = dropdownContainer.querySelector('.dropdown-options');
    if (!dropdownList) {
        console.error("toggleDropdown: Could not find .dropdown-options");
        return;
    }

    // Close all other dropdowns first
    document.querySelectorAll('.dropdown-options').forEach(list => {
        if (list !== dropdownList && list.style.display === "block") {
            list.style.display = "none";
        }
    });

    // Toggle this dropdown
    dropdownList.style.display = dropdownList.style.display === "block" ? "none" : "block";
}

        // Close dropdowns when clicking outside
        document.addEventListener("click", function(event) {
            if (!event.target.closest('.custom-dropdown')) {
                document.querySelectorAll('.dropdown-options').forEach(dropdown => {
                    dropdown.style.display = "none";
                });
            }
        });

</script>
