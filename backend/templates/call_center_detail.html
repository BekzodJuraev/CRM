  function showExistingFilePreview(fileUrl, previewId) {
  const container = document.getElementById(previewId);
  if (!container) return;

  container.innerHTML = ''; // clear previous
  const preview = document.createElement('div');
  preview.className = 'file-preview';

  const removeBtn = document.createElement('button');
  removeBtn.innerText = '×';
  removeBtn.className = 'remove-btn';
  removeBtn.onclick = () => {
    container.innerHTML = '';
    // optionally clear hidden field or flag for deletion
  };

  preview.appendChild(removeBtn);

  const isImage = /\.(jpg|jpeg|png|gif)$/i.test(fileUrl);
  if (isImage) {
    const img = document.createElement('img');
    img.src = fileUrl;
    img.alt = 'Предпросмотр изображения';
    img.style.cursor = 'pointer';
    img.onclick = () => window.open(fileUrl, '_blank');
    preview.appendChild(img);
  } else {
    const fileIcon = document.createElement('div');
    fileIcon.className = 'file-icon';
    fileIcon.innerHTML = `📄 ${fileUrl.split('/').pop()}`;
    fileIcon.style.cursor = 'pointer';
    fileIcon.onclick = () => {
      window.open(fileUrl, '_blank');
    };
    preview.appendChild(fileIcon);
  }

  container.appendChild(preview);
}

</script>

<script>
let map, placemark, miniMapInstance;

function openGeoModal() {
  document.getElementById("geoModal").style.display = "block";

  setTimeout(initMap, 300);
}

function initMap() {
  if (map) return;

  map = new ymaps.Map("map", {
    center: [41.311081, 69.240562],
    zoom: 12
  });

  map.events.add('click', function (e) {
    const coords = e.get('coords');

    if (!placemark) {
      placemark = new ymaps.Placemark(coords, {}, { draggable: true });
      map.geoObjects.add(placemark);
    } else {
      placemark.geometry.setCoordinates(coords);
    }

    document.getElementById('latitude').value = coords[0];
    document.getElementById('longitude').value = coords[1];

    document.getElementById('geo-status').innerText = '📍 Геолокация выбрана';
    document.getElementById("geoModal").style.display = "none";

    showMiniMap(coords[0], coords[1]);
  });
}

function showMiniMap(lat, lon) {
  const miniMapContainer = document.getElementById("mini-map");
  const pick = document.getElementById("pick_map");
  if (pick) pick.style.display = "block";

  miniMapContainer.style.display = "block";

  if (miniMapInstance) {
    miniMapInstance.destroy();
  }

  miniMapInstance = new ymaps.Map("mini-map", {
    center: [lat, lon],
    zoom: 15,
    controls: []
  });

  const miniPlacemark = new ymaps.Placemark([lat, lon]);
  miniMapInstance.geoObjects.add(miniPlacemark);
}

window.onclick = function (event) {
  const modal = document.getElementById("geoModal");
  if (event.target === modal) {
    modal.style.display = "none";
  }
};

// ✅ Auto-run showMiniMap if latitude and longitude are filled
ymaps.ready(function () {
  const latInput = document.getElementById("latitude");
  const lonInput = document.getElementById("longitude");

  if (latInput && lonInput) {
    const lat = parseFloat(latInput.value);
    const lon = parseFloat(lonInput.value);

    if (!isNaN(lat) && !isNaN(lon)) {
      showMiniMap(lat, lon);
      document.getElementById('geo-status').innerText = '📍 Геолокация выбрана';
    }
  }
});


</script>
<script>
  function handleFile(input,previewId) {
    const file = input.files[0];
    const container = document.getElementById(previewId);
    container.innerHTML = ''; // clear previous

    if (!file) return;

    const preview = document.createElement('div');
    preview.className = 'file-preview';

    const removeBtn = document.createElement('button');
    removeBtn.innerText = '×';
    removeBtn.className = 'remove-btn';
    removeBtn.onclick = () => {
      input.value = ''; // reset file input
      container.innerHTML = '';
    };

    preview.appendChild(removeBtn);

    const isImage = file.type.startsWith('image/');

    if (isImage) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = 'Предпросмотр изображения';
      img.style.cursor = 'pointer';
      img.onclick = () => window.open(img.src, '_blank');
      preview.appendChild(img);
    } else {
      const fileIcon = document.createElement('div');
      fileIcon.className = 'file-icon';
      fileIcon.innerHTML = `📄 ${file.name}`;
      fileIcon.style.cursor = 'pointer';
      fileIcon.onclick = () => {
        const url = URL.createObjectURL(file);
        window.open(url, '_blank');
      };
      preview.appendChild(fileIcon);
    }

    container.appendChild(preview);
  }
  function submitDeleteForm() {
    document.getElementById('delete-form').submit();
}
</script>
