<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить клиента — CRM</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1c1f26;
      color: #f5f5f5;
    }

    header {
      background: #101214;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      color: #ffd700;
      font-weight: 600;
      font-size: 24px;
    }

    .container {
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }

    .toggle-buttons {
      display: flex;
      margin-bottom: 20px;
    }

    .toggle-buttons button {
      background-color: #2c2f36;
      color: #f5f5f5;
      border: 1px solid #444;
      padding: 10px 20px;
      margin-right: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .toggle-buttons button.active {
      background-color: #ffd700;
      color: #1c1f26;
    }

    form label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    form input, form select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #2c2f36;
      color: #f5f5f5;
    }

    form button {
      margin-top: 20px;
      background-color: #ffd700;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      color: #1c1f26;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>CRM — Добавить клиента</h1>
    <div>👤 {{request.user.profile.name}}</div>
  </header>

  <div class="container">
    <div class="toggle-buttons">
      <button id="btn-individual" class="active">Физическое лицо</button>
      <button id="btn-legal">Юридическое лицо</button>
    </div>

    <form id="client-form" METHOD="POST">
      {% csrf_token %}
      <div id="individual-fields">
        <label>Фамилия:</label>
        <input type="text" placeholder="Введите фамилию" name="lastname" required>

        <label>Имя:</label>
        <input type="text" placeholder="Введите имя" name="name" required>

        <label>Отчество:</label>
        <input type="text" placeholder="Введите отчество" name="middle_name" required>

        <label>Номер телефона:</label>
         <input type="tel"
       name="phone"
       placeholder="+998901234567"
       pattern="^\+998\d{9}$"
       title="+998901234567"
       required>

        <label>Источник:</label>
       <select  name="social" required>
                <option value="social">Социальные сети</option>
                <option value="cold_calls">Холодные звонки</option>
                <option value="word_of_mouth">Сарафанное радио</option>
            </select>

        <input hidden name="action" value="INDIVIDUAL">
         <button type="submit">Сохранить</button>
      </div>
    </form>
      <form method="POST">
        {% csrf_token %}
      <div id="legal-fields" class="hidden">
        <label>Наименование организации:</label>
        <input type="text" placeholder="ООО 'Пример'" name="company_name" required>

        <label>ИНН:</label>
        <input type="text" placeholder="ИНН" name="inn" required>

        <label>Расчётный счёт (Р/С):</label>
        <input type="number" placeholder="Р/С" name="account" required>

        <label>МФО:</label>
        <input type="number" placeholder="МФО" name="mfo" required>

        <label>Юридический адрес:</label>
        <input type="text" placeholder="Адрес" name="adress" required>

        <label>Номер телефона:</label>
        <input type="tel"
       name="phone"
       placeholder="+998901234567"
       pattern="^\+998\d{9}$"
       title="+998901234567"
       required>

        <label>Источник:</label>
        <select  name="social" required>
                <option value="social">Социальные сети</option>
                <option value="cold_calls">Холодные звонки</option>
                <option value="word_of_mouth">Сарафанное радио</option>
            </select>


        <button type="submit">Сохранить</button>
      </div>


    </form>
  </div>

  <script>
    const btnIndividual = document.getElementById('btn-individual');
    const btnLegal = document.getElementById('btn-legal');
    const individualFields = document.getElementById('individual-fields');
    const legalFields = document.getElementById('legal-fields');

    btnIndividual.addEventListener('click', () => {
      btnIndividual.classList.add('active');
      btnLegal.classList.remove('active');
      individualFields.classList.remove('hidden');
      legalFields.classList.add('hidden');
    });

    btnLegal.addEventListener('click', () => {
      btnLegal.classList.add('active');
      btnIndividual.classList.remove('active');
      legalFields.classList.remove('hidden');
      individualFields.classList.add('hidden');
    });
  </script>
</body>
</html>
