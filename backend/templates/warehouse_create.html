{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Добавить резидента</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background-color: #f3f4f6;
      padding: 40px;
      color: #1f2937;
    }

    .form-container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 28px;
    }

    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    form input,
    form select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    form input[type="file"] {
      padding: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #fbbf24;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover {
      background-color: #f59e0b;
    }


  </style>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="{% static 'js/orders.js' %}"></script>
</head>
<body>
  <div class="form-container">
    <h2>Добавить поступление</h2>
    <form action="" method="POST" >
      {% csrf_token %}


      <label for="city">Выберите город:</label>
      <select id="city" name="city">
        <option value="Самарканд" selected>Самарканд</option>

      </select>
        <div class="category-container" id="categories-container">
           <div class="category-group">
      <label >Категория заказа:</label>
      <select class="form-select" name="category">
            <option value="Наружная реклама и макеты">Наружная реклама и макеты</option>
            <option value="Типография">Типография</option>
            <option value="Полиграфия">Полиграфия</option>
        </select>
      <label >Добавить расходники:</label>
          <div class="input-group">
                <div class="custom-dropdown">
            <div class="selected" onclick="toggleDropdown(this)">-- Выберите --</div>
            <ul class="dropdown-options" id="dropdown-list"></ul><br>
            <input type="hidden" name="product" value="selectedValue" id="selectedValue">
        </div>
          </div>
           </div>



      <label >Укажите количество расходника:</label>
      <input type="number"  name="quantity" required  />

      <label >Дата поступления:</label>
      <input type="date"  name="created_at"   required/>

      <label >Поставщик:</label>
      <select name="user_id">
      {% for item in provider %}
        <option value="{{ item.pk }}">{{ item.name }} {{ item.lastname }} {{ item.middle_name }}</option>
      {% endfor %}
    </select>





      <button type="submit" class="btn-submit">Сохранить</button>
    </form>
  </div>
</body>
</html>
